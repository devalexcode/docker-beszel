services:
  # ==========================================
  # BESZEL HUB
  # Dashboard web
  # ==========================================
  beszel:
    # Versión fijada para evitar actualizaciones inesperadas.
    image: henrygd/beszel:0.18.8
    container_name: ${BESZEL_CONTAINER_NAME}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Permite crear la base SQLite en el volumen bind del host.
    cap_add:
      - DAC_OVERRIDE
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

    environment:
      APP_URL: ${BESZEL_APP_URL}

    ports:
      # Solo accesible localmente.
      # Caddy será quien lo exponga por HTTPS.
      - "127.0.0.1:${BESZEL_PORT}:8090"

    volumes:
      # Base de datos y configuración
      - ./beszel_data:/beszel_data

      # Comunicación local con el Agent
      - ./beszel_socket:/beszel_socket

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s

  # ==========================================
  # BESZEL AGENT
  # Monitorea este servidor
  # ==========================================
  beszel-agent:
    # Debe mantenerse en la misma versión que el Hub.
    image: henrygd/beszel-agent:0.18.8
    container_name: ${BESZEL_AGENT_CONTAINER_NAME}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

    # Necesario para obtener correctamente
    # estadísticas de red del host
    network_mode: host

    volumes:
      # Datos persistentes del Agent
      - ./beszel_agent_data:/var/lib/beszel-agent

      # Comunicación con Hub
      - ./beszel_socket:/beszel_socket

      # Permite monitorear todos los contenedores Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      LISTEN: /beszel_socket/beszel.sock

      # Como usa network_mode host,
      # localhost:7777 apunta al puerto publicado por Beszel
      HUB_URL: ${BESZEL_AGENT_HUB_URL}

      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}

    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      start_period: 10s
      timeout: 5s
